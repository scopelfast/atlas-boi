<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rota — Atlas Boi</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
      }
      .legend {
        position: absolute;
        z-index: 1000;
        left: 8px;
        bottom: 8px;
        display: flex;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(10, 10, 10, 0.85);
        color: #e5e5e5;
        font: 11px/1.3 system-ui, sans-serif;
        pointer-events: none;
      }
      .legend span::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
      }
      .legend .o::before {
        background: #34d399;
      }
      .legend .d::before {
        background: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="legend" id="legend" hidden>
      <span class="o" id="legO">Embarque</span>
      <span class="d" id="legD">Descarga</span>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      (function () {
        const q = new URLSearchParams(location.search);
        const oLat = parseFloat(q.get("oLat"));
        const oLng = parseFloat(q.get("oLng"));
        const dLat = parseFloat(q.get("dLat"));
        const dLng = parseFloat(q.get("dLng"));
        const oLabel = q.get("oLabel") || "Embarque";
        const dLabel = q.get("dLabel") || "Descarga";
        const oOk = Number.isFinite(oLat) && Number.isFinite(oLng);
        const dOk = Number.isFinite(dLat) && Number.isFinite(dLng);

        const map = L.map("map", { zoomControl: true, attributionControl: true });
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: "&copy; OpenStreetMap",
        }).addTo(map);

        const mk = (color) =>
          L.divIcon({
            className: "",
            html:
              '<div style="width:14px;height:14px;border-radius:50%;background:' +
              color +
              ';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7],
          });

        const bounds = [];
        const legend = document.getElementById("legend");
        const legO = document.getElementById("legO");
        const legD = document.getElementById("legD");

        if (oOk) {
          L.marker([oLat, oLng], { icon: mk("#34d399") })
            .addTo(map)
            .bindPopup(oLabel);
          bounds.push([oLat, oLng]);
          legO.textContent = oLabel;
          legO.hidden = false;
        } else {
          legO.hidden = true;
        }
        if (dOk) {
          L.marker([dLat, dLng], { icon: mk("#fbbf24") })
            .addTo(map)
            .bindPopup(dLabel);
          bounds.push([dLat, dLng]);
          legD.textContent = dLabel;
          legD.hidden = false;
        } else {
          legD.hidden = true;
        }

        if (bounds.length === 2) {
          L.polyline(bounds, { color: "#34d399", weight: 3, opacity: 0.75, dashArray: "6 6" }).addTo(map);
          map.fitBounds(bounds, { padding: [28, 28], maxZoom: 12 });
          legend.hidden = false;
        } else if (bounds.length === 1) {
          map.setView(bounds[0], 11);
          legend.hidden = false;
        } else {
          map.setView([-14.2, -51.9], 4);
        }
      })();
    </script>
  </body>
</html>
