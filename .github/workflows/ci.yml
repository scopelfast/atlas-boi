name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas_boi
          POSTGRES_PASSWORD: atlas_test
          POSTGRES_DB: atlas_boi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm install

      - name: Prisma Generate
        env:
          DATABASE_URL: postgresql://atlas_boi:atlas_test@localhost:5432/atlas_boi_test
        run: npx prisma generate

      - name: Prisma Migrate
        env:
          DATABASE_URL: postgresql://atlas_boi:atlas_test@localhost:5432/atlas_boi_test
        run: npx prisma migrate deploy

      - run: npm run build

      - name: Unit tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm install

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3004
